name: ufca-cct

services:
  painel:
    build: .
    environment:
      FRONTEND_PORT: "${FRONTEND_PORT:-8000}"
      API_PORT: "${API_PORT:-8001}"
      DATA_PATH: "${DATA_PATH:-data/ufca}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8000}:${FRONTEND_PORT:-8000}"
      - "127.0.0.1:${API_PORT:-8001}:${API_PORT:-8001}"
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from os import environ; from urllib.request import urlopen; urlopen('http://localhost:' + environ['FRONTEND_PORT'] + '/painel.js', timeout=3).close(); urlopen('http://localhost:' + environ['API_PORT'] + '/api/v1/painel/cct', timeout=3).close()"
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 5s
